<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voltando ao app…</title>
    <style>
      body { font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f8fafc; color: #1e293b; }
      .box { text-align: center; padding: 2rem; }
      .spinner { width: 36px; height: 36px; border: 3px solid #cbd5e1; border-top-color: #0d9488; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="spinner"></div>
      <p>Autenticação concluída. Voltando ao app…</p>
      <p><a href="/">Abrir no navegador</a></p>
    </div>
    <script>
      (function () {
        var q = new URLSearchParams(location.search);
        var h = new URLSearchParams(location.hash.replace(/^#/, ''));
        ['access_token', 'refresh_token', 'expires_in', 'token_type', 'provider', 'code', 'state'].forEach(function (k) {
          if (h.get(k) && !q.get(k)) q.set(k, h.get(k));
        });
        var err = h.get('error_description') || h.get('error') || q.get('error_description') || q.get('error');
        var target = 'com.mateus.meumounjaro://auth/callback';
        var qs = q.toString();
        if (qs) target += '?' + qs;
        if (err) target += (qs ? '&' : '?') + 'oauth_error=' + encodeURIComponent(err);
        setTimeout(function () { location.replace(target); }, 400);
      })();
    </script>
  </body>
</html>
